env:
  BUILDKITE_GIT_SUBMODULES: "true"

steps:
  - label: ":gear: singularity-desktop meson build (arm64, native aarch64)"
    key: "build_arm64"
    agents:
      queue: "arm64"
    timeout_in_minutes: 90
    command: |
      set -euo pipefail
      echo "--- :git: checkout info"
      git log -1 --format='commit=%H date=%ci'
      git submodule status | head -30

      echo "--- :arrows_counterclockwise: sync submodules to upstream tips"
      # Build against upstream's CURRENT code, not a frozen pin. The pin had
      # rotted badly: it sat at 397dc46 (2026-07-05), a commit upstream had
      # since REWRITTEN OUT of main entirely, so every build reproduced a
      # snapshot that no longer existed upstream and no current patch could
      # apply to it. --remote follows the branch named in .gitmodules (main).
      git submodule update --remote --checkout --recursive
      echo "--- :bookmark: exact commits built (record these; --remote floats)"
      git submodule status --recursive | sed 's/^/  /'

      echo "--- :adhesive_bandage: downstream patches"
      # These carry fixes that are NOT upstream yet (layer-shell close path,
      # sensors panel item). A patch that fails to apply fails the build.
      bash scripts/apply-downstream-patches.sh

      echo "--- :docker: build (debian:testing arm64 -- MUST match the target distro)"
      # NOT ubuntu:26.04. An Ubuntu-built payload links different sonames than
      # Debian forky provides, and the result does not merely warn -- it fails to
      # start. Measured 2026-08-11 on O6N: labwc died with "libdisplay-info.so.5:
      # cannot open shared object file", greetd crash-looped, and the board had no
      # desktop at all. build/build-singularity.sh in cix-installer already
      # documents this (Forky has libsodium.so.26, Ubuntu builds want .so.23) and
      # switches to debian:testing on its own; this pipeline had drifted from it
      # while still claiming to match it.
      cat > /tmp/bk-build.sh <<'SCRIPT'
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -q
      apt-get install -y --no-install-recommends \
          ca-certificates git golang-go \
          valac meson ninja-build pkg-config gettext \
          libgirepository1.0-dev gobject-introspection \
          libgtk-4-dev libadwaita-1-dev libgtk4-layer-shell-dev \
          libwayland-dev wayland-protocols \
          libvte-2.91-gtk4-dev libgtksourceview-5-dev \
          libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-good gstreamer1.0-pipewire \
          libpulse-dev libpolkit-gobject-1-dev libpolkit-agent-1-dev \
          libjson-glib-dev libpeas-2-dev libpipewire-0.3-dev \
          libgee-0.8-dev libsoup-3.0-dev \
          libdrm-dev libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
          libupower-glib-dev libnm-dev sassc \
          libatspi2.0-dev libcmocka-dev libdbusmenu-glib-dev libfontconfig-dev \
          libgoa-1.0-dev libinput-dev libpng-dev librsvg2-dev libsecret-1-dev \
          libxml2-dev libpixman-1-dev libpoppler-glib-dev libsystemd-dev \
          libtracker-sparql-3.0-dev libwebkitgtk-6.0-dev libxcb-ewmh-dev \
          libxcb-icccm4-dev libxkbcommon-dev libpam0g-dev \
          libgcrypt20-dev libsodium-dev libcrypt-dev \
          hwdata libxcb-dri3-dev xwayland \
          libxcb-composite0-dev libxcb-render0-dev libxcb-res0-dev \
          libxcb-xfixes0-dev libxcb-errors-dev libxcb-present-dev \
          build-essential

      # vetro host tool (UI .vetro -> .ui transpiler) — required by 15 subproject
      # meson.build files (singularity-calculator, singularity-files, etc).
      git clone --depth 1 https://github.com/singularityos-lab/vetro /tmp/vetro
      ( cd /tmp/vetro && go build -o /usr/local/bin/vetro . )
      vetro --version 2>/dev/null || true

      cd /workdir
      meson setup build --prefix=/opt/singularity --libdir=lib --buildtype=release
      ninja -C build

      if [ -d subprojects/labwc ]; then
        # --libdir=lib matches the top-level build (above) explicitly. Without
        # it, meson falls back to its own Debian-multiarch auto-default for
        # this SEPARATE configure invocation, so wlroots -> libdisplay-info
        # (pulled in transitively via --force-fallback-for) installs to
        # lib/aarch64-linux-gnu/ instead of flat lib/ -- invisible to both
        # ncz-singularity-greeter/ncz-singularity's LD_LIBRARY_PATH and the
        # shipped ld.so.conf.d entry. labwc dlopen-failed on
        # libdisplay-info.so.5, greetd crash-looped, black screen. Confirmed
        # live on external tester hardware 2026-09-15 (see cix-installer
        # commit a3831a4/817fe65 for the belt-and-suspenders runtime fix that
        # covers already-built payloads; this is the actual root-level fix).
        meson setup build-labwc subprojects/labwc --prefix=/opt/singularity \
            --libdir=lib --buildtype=release -Dxwayland=enabled --force-fallback-for=wlroots-0.20
        ninja -C build-labwc
      fi

      rm -rf /workdir/stage
      DESTDIR=/workdir/stage meson install -C build
      [ -d build-labwc ] && DESTDIR=/workdir/stage meson install -C build-labwc || true

      test -x "/workdir/stage/opt/singularity/bin/singularity-desktop"
      test -x "/workdir/stage/opt/singularity/bin/singularity-labwc-session"

      cd /workdir/stage
      tar -czf /workdir/singularity-opt.tgz opt/singularity
      echo "STAGED $$(du -h /workdir/singularity-opt.tgz | cut -f1)"
      SCRIPT
      chmod +x /tmp/bk-build.sh

      set +e
      docker run --rm \
        -v "$$PWD":/workdir:z \
        -v /tmp/bk-build.sh:/bk-build.sh:ro,z \
        debian:testing \
        bash /bk-build.sh
      BUILD_RC=$$?
      set -e

      # The container runs as root, so files it creates under the bind-mounted
      # checkout are root-owned. The buildkite-agent host user (unprivileged)
      # needs to be able to clean this checkout up for the next build — fix
      # ownership back unconditionally, even if the build itself failed.
      echo "--- :broom: restoring checkout ownership"
      docker run --rm -v "$$PWD":/workdir:z alpine chown -R "$$(id -u):$$(id -g)" /workdir

      if [ "$$BUILD_RC" -ne 0 ]; then
        echo "🚨 build failed (exit $$BUILD_RC)"
        exit "$$BUILD_RC"
      fi

      echo "--- :mag: verify the payload carries the close-path fix"
      # A build log, a filename and a version string all looked fine while the
      # payload was unpatched. The only honest check is the binary itself.
      # Look in the desktop binary AND the staged shared objects: the call can
      # legitimately live in a library rather than the executable, and a guard
      # that only inspects the executable would then fail on a good payload.
      # Strictness is unchanged -- the symbol must exist SOMEWHERE in the payload.
      if ! (readelf --dyn-syms stage/opt/singularity/bin/singularity-desktop 2>/dev/null; \
            find stage/opt/singularity -name '*.so*' -exec readelf --dyn-syms {} \; 2>/dev/null) \
           | grep -q gtk_widget_unrealize; then
        echo "🚨 payload is UNPATCHED -- it would reproduce the layer-shell crash" >&2
        # Diagnose instead of just failing. The two causes look identical from a
        # bare exit 1: (a) the symbol moved, (b) valac bound the GtkNative vfunc
        # gtk_native_unrealize instead of the widget one, which is the exact
        # failure mode upstream's cast in layer_window.vala guards against and
        # which a toolchain bump can silently reintroduce.
        echo "--- unrealize symbols actually present in the payload:" >&2
        (readelf --dyn-syms stage/opt/singularity/bin/singularity-desktop 2>/dev/null; \
         find stage/opt/singularity -name '*.so*' -exec readelf --dyn-syms {} \; 2>/dev/null) \
          | grep -i unrealize | sort -u | head -20 >&2
        echo "--- valac in this image: $$(valac --version 2>/dev/null)" >&2
        echo "--- if gtk_native_unrealize appears above and gtk_widget_unrealize does not," >&2
        echo "    this is a REAL regression from the vala codegen, not a stale guard." >&2
        exit 1
      fi
      echo "payload verified: carries gtk_widget_unrealize (PR #15)"

      echo "--- :package: artifact"
      ls -lh singularity-opt.tgz
      buildkite-agent artifact upload "singularity-opt.tgz"

      echo "--- :floppy_disk: stage the payload to ARGONAS"
      # Buildkite's own artifact download is UNUSABLE from our network: the API
      # 302s to buildkiteartifacts.com, and that host resolves to 0.0.0.0 from
      # public resolvers (verified against 1.1.1.1, not just our LAN DNS), so
      # curl fails in 2ms with "Could not connect to server". The nightly could
      # therefore never stage a payload even after the build went green.
      #
      # This agent runs on TYDEUS, on our own LAN, so it pushes the tarball to
      # ARGONAS directly and skips the CDN entirely. Least privilege: it writes
      # as jasonperlow (uid 3000) into a directory owned by that user, over a
      # key already trusted by ARGONAS -- no root, and no credential in this
      # repo, which would be caught by cix-installer's secret-scan gate anyway.
      #
      # DATED filename, never singularity-opt.tgz: promotion to the name the
      # beta build consumes stays an explicit human step.
      NCZ_SHA="$$(git submodule status --recursive -- subprojects/singularity-shell | head -1 | sed -E 's/^[[:space:]]*[-+U]?//' | cut -c1-12)"
      NCZ_STAMP="$$(date -u +%Y%m%d-%H%M%S)"
      NCZ_NAME="singularity-opt-$${NCZ_STAMP}-$${NCZ_SHA:-unknown}.tgz"
      if scp -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
             singularity-opt.tgz \
             "jasonperlow@192.168.207.101:/mnt/datapool/archives/ncz/singularity/staged/$${NCZ_NAME}"; then
        echo "staged to ARGONAS: $${NCZ_NAME}"
      else
        # Never fail the build over staging: the build result is the signal that
        # matters, and a NAS hiccup must not turn a green upstream into red.
        echo "WARNING: could not stage to ARGONAS (build result unaffected)" >&2
      fi

  - label: ":art: package and publish contributed wallpaper packs (.deb)"
    key: "publish_wallpaper_packs"
    agents:
      queue: "arm64"
    timeout_in_minutes: 15
    # NO depends_on, and no artifact download. Contributed wallpaper art is
    # cix-installer content and needs nothing whatsoever from the Singularity
    # Desktop payload. It lives in THIS pipeline only because this is the only
    # CI on our LAN: publication goes to the ARGOS apt host at 192.168.207.22,
    # and cix-installer's own .gitlab-ci.yml runs on GitLab SHARED runners,
    # which have no route there. Being an independent step also means a problem
    # here can never hold up or red the desktop build.
    #
    # $$ ESCAPING: same rule as the build_arm64 step above -- `buildkite-agent
    # pipeline upload` interpolates $VAR at UPLOAD time, so every $ meant for
    # the runtime shell is written $$.
    command: |
      set -euo pipefail
      trap 'rc=$$?; echo "[wallpaper_packs] ERROR: failed at line $${LINENO} (exit $$rc)" >&2; exit "$$rc"' ERR

      command -v dpkg-deb >/dev/null 2>&1 || {
        echo "[wallpaper_packs] ERROR: dpkg-deb is not installed on this agent; cannot package" >&2
        exit 1
      }

      echo "--- :git: obtaining cix-installer (art + packaging script)"
      # Everything stays under the agent's build directory. /tmp on the arm64
      # agent is a 31G tmpfs that was 80% full on 2026-09-12 and returned
      # EDQUOT partway through dpkg-deb's compression -- measured, not
      # hypothetical. Exporting TMPDIR is what actually fixes it: the
      # packaging script's `mktemp -d` and dpkg-deb's own compression scratch
      # both default to /tmp otherwise.
      PKG_ROOT="$$PWD/.cix-installer-wallpapers"
      rm -rf "$$PKG_ROOT"
      trap 'rm -rf "$$PKG_ROOT"' EXIT
      git clone --depth 1 https://gitlab.com/ncz-os/cix-installer.git "$$PKG_ROOT"
      # After the clone: git refuses a non-empty destination.
      export TMPDIR="$$PKG_ROOT/tmp"
      mkdir -p "$$TMPDIR"

      CONTRIB="$$PKG_ROOT/assets/branding/wallpaper/contrib"
      [ -d "$$CONTRIB" ] || {
        echo "[wallpaper_packs] ERROR: $$CONTRIB is missing from cix-installer" >&2
        exit 1
      }

      echo "--- :mag: reading the published package index"
      # The already-published check. A pack's version is HUMAN-BUMPED in
      # build-wallpaper-contrib-deb.sh's metadata block, so an unchanged pack
      # rebuilds to the same version every night and must not be re-uploaded;
      # a bumped one must be. Fetch failure is FATAL rather than treated as
      # "nothing is published" -- the latter would re-upload every pack on any
      # transient network fault, which is exactly the kind of silent churn this
      # check exists to prevent.
      INDEX="$$PKG_ROOT/published-Packages"
      curl -fsSL --retry 3 --retry-delay 5 \
        "https://packages.buildkite.com/ncz-os/ncz/any/dists/any/main/binary-arm64/Packages" \
        -o "$$INDEX"
      echo "index stanzas: $$(grep -c '^Package: ' "$$INDEX")"

      PUBLISHED=0
      SKIPPED=0
      NEEDS_KEY=0

      for dir in "$$CONTRIB"/*/; do
        [ -d "$$dir" ] || continue
        pack="$$(basename "$$dir")"
        echo "--- :art: $$pack"

        # An unknown pack is a HARD FAILURE, not a skip. The packaging script
        # refuses to guess an author or a licence (see its metadata block), and
        # art that silently never ships is worse than a red step somebody reads:
        # add the pack's metadata case and it builds.
        ( cd "$$PKG_ROOT" && bash build/build-wallpaper-contrib-deb.sh "$$pack" )

        deb="$$(find "$$PKG_ROOT/build/wallpaper-debs" -maxdepth 1 -type f \
                  -name "ncz-wallpapers-$${pack}_*_all.deb" -print -quit)"
        [ -n "$$deb" ] || {
          echo "[wallpaper_packs] ERROR: $$pack produced no .deb" >&2
          exit 1
        }

        # Identity comes off the ARTIFACT, never from a constructed filename --
        # the same rule ncz-reprepro-publish.sh applies at the receiving end.
        name="$$(dpkg-deb -f "$$deb" Package)"
        version="$$(dpkg-deb -f "$$deb" Version)"
        [ -n "$$name" ] && [ -n "$$version" ] || {
          echo "[wallpaper_packs] ERROR: could not read Package/Version from $$deb" >&2
          exit 1
        }

        if awk -v n="$$name" -v v="$$version" '
              /^Package: /{p=$$2} /^Version: /{if(p==n && $$2==v) found=1}
              END{exit !found}' "$$INDEX"; then
          echo "already published: $${name}_$${version} — nothing to do"
          SKIPPED=$$((SKIPPED + 1))
          continue
        fi

        if [ ! -r "$$HOME/.ssh/id_ed25519_argonas_apt" ]; then
          # Surfaced as a persistent build annotation rather than a red step or
          # a silent skip. The arm64 agent moved TYDEUS -> ULTRA on 2026-09-05
          # and the ARGOS deploy key did not move with it, so NOTHING can
          # publish from CI until it is reprovisioned -- including the
          # Singularity Desktop .deb. A hidden skip would let that gap persist
          # unnoticed; a red step on every nightly would train people to ignore
          # red. The packaging itself is still fully exercised above.
          echo "[wallpaper_packs] NOT PUBLISHED: $${name}_$${version}" >&2
          echo "[wallpaper_packs] ~/.ssh/id_ed25519_argonas_apt is missing on this agent." >&2
          NEEDS_KEY=$$((NEEDS_KEY + 1))
          continue
        fi

        echo ":rocket: publishing $${name}_$${version} to the NCZ-OS apt repository"
        ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -i "$$HOME/.ssh/id_ed25519_argonas_apt" \
            jasonperlow@192.168.207.22 < "$$deb"
        PUBLISHED=$$((PUBLISHED + 1))
      done

      echo "--- :art: $$PUBLISHED published, $$SKIPPED already current, $$NEEDS_KEY blocked on the deploy key"

      if [ "$$NEEDS_KEY" -gt 0 ] && command -v buildkite-agent >/dev/null 2>&1; then
        buildkite-agent annotate --style warning --context wallpaper-packs \
          "**$$NEEDS_KEY wallpaper pack(s) built but NOT published.** \`~/.ssh/id_ed25519_argonas_apt\` is missing on the arm64 agent, so nothing can reach the ARGOS apt host. This blocks the Singularity Desktop .deb publish too. Reprovision the ARGOS deploy key on the agent host." || true
      fi
